name: Publish core to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish js-number-to-word-processor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (signed attestations)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Full verify gate before publishing
        run: npm run verify

      - name: Publish (from packages/core, with provenance)
        run: npm publish --provenance --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
