name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full verify gate (lint + typecheck + test + build)
        run: npm run verify

      - name: Upload coverage summary
        if: always()
        run: npx vitest run --coverage --reporter=basic 2>&1 | tail -20 || true
